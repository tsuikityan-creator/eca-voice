<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校園語音活動查詢系統</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #1e293b;
    }
    .container {
      max-width: 450px;
      width: 100%;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }
    h1 { font-size: 22px; color: #0f172a; margin-bottom: 5px; }
    p.subtitle { color: #64748b; font-size: 14px; margin-bottom: 25px; }
    .mic-btn {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      font-size: 40px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
      transition: transform 0.2s, background 0.3s;
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mic-btn:active { transform: scale(0.95); }
    .mic-btn.speaking {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }
    .mic-btn.listening {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    #status { margin-top: 15px; font-weight: 600; color: #3b82f6; min-height: 24px; }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 12px;
      border-left: 4px solid #3b82f6;
      text-align: left;
      display: none;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }
    .card-title { font-weight: bold; font-size: 16px; color: #0f172a; }
    .card-detail { font-size: 14px; color: #475569; margin-top: 4px; }
    .manual-box {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px dashed #cbd5e1;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
    }
    .send-btn {
      padding: 10px 16px;
      background: #0f172a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🏫 課外活動語音查詢</h1>
  <p class="subtitle">撳掣講出你嘅「班別」同「班號」<br>例如：「1A班 1號」</p>

  <button id="micBtn" class="mic-btn" onclick="startVoiceFlow()">🎤</button>
  <div id="status">撳一下咪高峰開始查詢</div>

  <div id="resultBox" class="result-box">
    <div id="replyText" style="line-height: 1.5; font-size: 15px;"></div>
    <div id="cardsContainer"></div>
  </div>

  <div class="manual-box">
    <input type="text" id="manualInput" placeholder="收音唔清？可直接輸入 e.g. 1A 1">
    <button class="send-btn" onclick="handleManual()">查詢</button>
  </div>
</div>

<script>
  // ⚠️ 請將下面雙引號入面嘅文字，換成你嘅 Google Apps Script /exec 網址
  const GAS_API_URL = "貼上你嘅APPS_SCRIPT網址";

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-HK';
    recognition.interimResults = false;

    recognition.onstart = function() {
      const btn = document.getElementById('micBtn');
      btn.classList.remove('speaking');
      btn.classList.add('listening');
      document.getElementById('status').innerText = '🔴 聆聽中... 請講出班別同班號';
    };

    recognition.onresult = function(event) {
      const transcript = event.results[0][0].transcript;
      document.getElementById('status').innerText = `聽到：「${transcript}」，查詢中...`;
      searchServer(transcript);
    };

    recognition.onerror = function(event) {
      resetBtn();
      if (event.error === 'not-allowed') {
        document.getElementById('status').innerText = '❌ 權限被拒：請按瀏覽器「允許」使用咪高峰';
      } else if (event.error === 'no-speech') {
        document.getElementById('status').innerText = '⚠️ 聽唔到聲音，請靠近咪高峰再試';
      } else {
        document.getElementById('status').innerText = '❌ 收音錯誤：' + event.error;
      }
    };

    recognition.onend = function() {
      resetBtn();
    };
  } else {
    document.getElementById('status').innerText = '❌ 此瀏覽器不支援語音功能，請改用 Chrome 或 Safari';
  }

  function resetBtn() {
    const btn = document.getElementById('micBtn');
    btn.classList.remove('listening', 'speaking');
  }

  // 主流程：先語音問好，講完自動開咪收音
  function startVoiceFlow() {
    if (!recognition) return;
    
    // 如果正在收音，再按一下就停止
    if (document.getElementById('micBtn').classList.contains('listening')) {
      recognition.stop();
      return;
    }

    window.speechSynthesis.cancel();
    const btn = document.getElementById('micBtn');
    btn.classList.add('speaking');
    document.getElementById('status').innerText = '🔊 系統提示中...';

    const greeting = "同學你好，請你說出你的班別和班號";
    
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(greeting);
      utterance.lang = 'zh-HK';
      utterance.rate = 1.05; // 語速稍快一點，學生不用等太久
      
      let hasStarted = false;
      const beginListening = () => {
        if (hasStarted) return;
        hasStarted = true;
        try {
          recognition.start();
        } catch (e) {
          console.log(e);
        }
      };

      // 講完歡迎詞後，自動啟動咪高峰
      utterance.onend = beginListening;
      utterance.onerror = beginListening;

      window.speechSynthesis.speak(utterance);

      // 安全保險機制：萬一某些舊手機無觸發 onend，4.5 秒後強制自動開咪
      setTimeout(beginListening, 4500);
    } else {
      recognition.start();
    }
  }

  function handleManual() {
    const val = document.getElementById('manualInput').value.trim();
    if (val) {
      document.getElementById('status').innerText = '查詢中...';
      searchServer(val);
    }
  }

  function searchServer(text) {
    fetch(GAS_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ spokenText: text })
    })
    .then(response => response.json())
    .then(res => {
      document.getElementById('status').innerText = '查詢完成';
      const resultBox = document.getElementById('resultBox');
      const replyText = document.getElementById('replyText');
      const cardsContainer = document.getElementById('cardsContainer');
      
      resultBox.style.display = 'block';
      replyText.innerText = res.message;
      cardsContainer.innerHTML = '';

      if (res.success && res.activities && res.activities.length > 0) {
        res.activities.forEach(act => {
          cardsContainer.innerHTML += `
            <div class="card">
              <div class="card-title">📌 ${act.name}</div>
              <div class="card-detail">⏰ 時間：${act.time}</div>
              <div class="card-detail">📍 地點：${act.location}</div>
            </div>
          `;
        });
      }
      // 讀出搜尋結果
      speakCantonese(res.message);
    })
    .catch(err => {
      document.getElementById('status').innerText = '❌ 連線失敗，請確認已貼上正確嘅 /exec 網址';
    });
  }

  function speakCantonese(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-HK';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }
  }
</script>

</body>
</html>
